<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voyage & Vellum — Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="#home" data-page="home"><span class="brand-mark">✦</span><span>Voyage <i>&</i> Vellum</span></a>
  <nav>
    <button data-page="home">Home</button><button data-page="explore">Explore</button><button data-page="planner">Trip planner</button><button data-page="booking">Book now</button><button data-page="saved">Saved trips</button><button data-page="community">Community</button>
  </nav>
  <button class="menu-toggle" aria-label="Menu">☰</button>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☾</button>
  <button class="avatar" id="profileBtn">AS</button>
</header>
<main id="app"></main>
<footer><span>© 2026 Voyage & Vellum</span><span>Slow travel, beautifully planned.</span></footer>
</footer>

<!-- modal login -->
<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-action="close"></div>
  <div class="modal-content" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="eyebrow">Sign in</div>
    <h2 style="margin-top:6px;margin-bottom:8px">Welcome back</h2>
    <p class="lead">Sign in to view your profile and saved trips.</p>
    <form id="modalLoginForm" style="margin-top:16px">
      <div class="field"><label>Name</label><input id="modalLoginName" required></div>
      <div class="field"><label>Email</label><input id="modalLoginEmail" type="email" required></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" type="submit">Sign in</button>
        <button class="btn light" type="button" id="modalCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- profile edit modal -->
<div id="profileEditModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-action="close"></div>
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="profileEditTitle">
    <button class="modal-close" data-action="close" aria-label="Close">×</button>
    <h3 id="profileEditTitle">Edit profile</h3>
    <form id="profileEditForm" style="margin-top:12px">
      <div class="field"><label>Name</label><input id="editName" required></div>
      <div class="field"><label>Email</label><input id="editEmail" type="email"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn" type="submit">Save</button>
        <button class="btn light" type="button" data-action="close">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- booking confirmation modal -->
<div id="bookingConfirmModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-action="close"></div>
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bookingConfirmTitle">
    <button class="modal-close" data-action="close" aria-label="Close">×</button>
    <h3 id="bookingConfirmTitle">Confirm booking request</h3>
    <div id="bookingSummary" style="margin-top:12px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" id="confirmBookingBtn">Confirm</button>
      <button class="btn light" data-action="close">Cancel</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
